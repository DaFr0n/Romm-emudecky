name: Temporary CI formatting repair
on:
  push:
    branches: [fix/ci-shortcut-path-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-shortcut-path-test
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install ruff
      - name: Fix Python lint and formatting
        run: |
          ruff check --fix .
          ruff format .
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format Markdown
        run: deno fmt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix Markdown lint
        run: |
          npx --yes markdownlint-cli2@0.23.0 --fix "**/*.md" "!node_modules" "!.worktrees" "!CHANGELOG.md"
          deno fmt
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff and Markdown format fixes"
            git push origin HEAD:fix/ci-shortcut-path-test
          fi
