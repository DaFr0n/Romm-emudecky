name: Build EmuDeck Plugin ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - emudeck-port

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Decky CLI
        run: |
          mkdir -p /tmp/decky-cli
          curl --fail --location \
            -o /tmp/decky-cli/decky \
            https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64
          echo "6777e356508c1ce887f8e61b0fa4954bb48b32e6d97341eef68ea4e0d6ead9a0  /tmp/decky-cli/decky" | sha256sum -c -
          chmod +x /tmp/decky-cli/decky
          echo "/tmp/decky-cli" >> "$GITHUB_PATH"

      - name: Build Decky ZIP
        run: |
          sudo "$(which decky)" plugin build \
            -o /tmp/output \
            -s directory "$GITHUB_WORKSPACE"

      - name: Verify package
        run: |
          ZIP=$(find /tmp/output -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP"
          for required in \
            main.py plugin.json package.json \
            dist/index.js py_modules/bootstrap.py \
            bin/rom-launcher bios_registry.json; do
            unzip -l "$ZIP" | grep -qF "$required" || {
              echo "Missing required file: $required"
              exit 1
            }
          done

      - name: Scan packaged ZIP for secrets
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          import zipfile

          archives = list(pathlib.Path("/tmp/output").glob("*.zip"))
          if len(archives) != 1:
              sys.exit("Expected exactly one packaged plugin ZIP")

          forbidden_names = re.compile(
              r"(^|/)(\.env(?:\.[^/]*)?|id_(?:rsa|ed25519|ecdsa)|"
              r"credentials(?:\.[^/]*)?|secrets?(?:\.[^/]*)?|"
              r"\.npmrc|\.pypirc|\.netrc|\.ssh|"
              r"[^/]*\.(?:pem|p12|pfx|key|kdbx))$",
              re.IGNORECASE,
          )
          secret_patterns = [
              re.compile(rb"-----BEGIN (?:[A-Z ]* )?PRIVATE KEY-----"),
              re.compile(rb"gh[pousr]_[A-Za-z0-9_]{20,}"),
              re.compile(rb"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(rb"AKIA[0-9A-Z]{16}"),
              re.compile(rb"(?i)(?:password|passwd|api[_-]?key|secret|access[_-]?token|refresh[_-]?token)\s*[:=]\s*['\"]?[^\s'\"{}$]{12,}"),
          ]
          issues = []
          with zipfile.ZipFile(archives[0]) as archive:
              for item in archive.infolist():
                  name = item.filename.replace("\\", "/")
                  if item.is_dir():
                      continue
                  if name.startswith("/") or ".." in pathlib.PurePosixPath(name).parts:
                      issues.append("Unsafe archive path")
                      continue
                  if forbidden_names.search(name):
                      issues.append("Sensitive filename present")
                  if item.file_size > 10_000_000:
                      continue
                  if pathlib.PurePosixPath(name).suffix.lower() in {
                      ".png", ".jpg", ".jpeg", ".webp", ".gif", ".ico",
                      ".woff", ".woff2", ".ttf", ".otf", ".wasm", ".zip",
                      ".gz", ".pdf",
                  }:
                      continue
                  data = archive.read(item)
                  if any(pattern.search(data) for pattern in secret_patterns):
                      issues.append("Possible embedded credential in packaged content")
          if issues:
              for issue in sorted(set(issues)):
                  print("::error::" + issue)
              sys.exit(1)
          print("Packaged ZIP secret-pattern and sensitive-file scan passed.")
          PY

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RomM-EmuDeck-Decky-Plugin
          path: /tmp/output/*.zip
          if-no-files-found: error
